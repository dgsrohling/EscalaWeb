{% extends "base.html" %}
{% block title %}Registrar Plantões - Passo 1{% endblock %}
{% block content %}
<h1><i class="bi bi-clock-history"></i> Registrar Plantões - Passo 1/2</h1>
<p class="text-muted">Selecione o servidor e a competência</p>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Servidor *</label>
                <select name="servidor_id" class="form-select" required>
                    <option value="">Selecione...</option>
                    {% for servidor in servidores %}
                    <option value="{{ servidor.id }}">
                        {{ servidor.matricula }} - {{ servidor.nome_completo }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Mês *</label>
                    <select name="mes" class="form-select" required>
                        {% for m in range(1, 13) %}
                        <option value="{{ m }}" {{ 'selected' if m == mes_default }}>
                            {{ ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                                'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'][m-1] }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Ano *</label>
                    <input type="number" name="ano" class="form-control" value="{{ ano_default }}" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Próximo <i class="bi bi-arrow-right"></i></button>
        </form>
    </div>
</div>
{% endblock %}
