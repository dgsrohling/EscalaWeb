{% extends "base.html" %}

{% block title %}{{ 'Editar' if secretaria else 'Nova' }} Secretaria{% endblock %}

{% block content %}
<div class="row mb-3">
    <div class="col-md-12">
        <h1><i class="bi bi-building"></i> {{ 'Editar' if secretaria else 'Nova' }} Secretaria</h1>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="sigla" class="form-label">Sigla *</label>
                    <input type="text" class="form-control" id="sigla" name="sigla" 
                           value="{{ secretaria.sigla if secretaria else '' }}" 
                           required maxlength="20" style="text-transform: uppercase;">
                    <small class="text-muted">Ex: SESAU, SELOG, SEMED</small>
                </div>
                
                <div class="col-md-8 mb-3">
                    <label for="nome" class="form-label">Nome Completo *</label>
                    <input type="text" class="form-control" id="nome" name="nome" 
                           value="{{ secretaria.nome if secretaria else '' }}" 
                           required maxlength="200">
                    <small class="text-muted">Nome completo da secretaria</small>
                </div>
            </div>
            
            <div class="mb-3">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" id="ativa" name="ativa" 
                           {{ 'checked' if not secretaria or secretaria.ativa else '' }}>
                    <label class="form-check-label" for="ativa">Ativa</label>
                </div>
            </div>
            
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle"></i> Salvar
                </button>
                <a href="{{ url_for('secretarias.lista') }}" class="btn btn-secondary">
                    <i class="bi bi-x-circle"></i> Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
