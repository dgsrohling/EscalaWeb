{% extends "base.html" %}
{% block title %}Nova Escala - Passo 2{% endblock %}
{% block content %}
<h1><i class="bi bi-calendar-plus"></i> Nova Escala - Passo 2/3</h1>
<p class="text-muted">Selecione os servidores e o modo de distribuição</p>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Servidores *</label>
                <div class="border p-3" style="max-height: 300px; overflow-y: auto;">
                    {% for servidor in servidores %}
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" name="servidores_ids" 
                               value="{{ servidor.id }}" id="serv_{{ servidor.id }}">
                        <label class="form-check-label" for="serv_{{ servidor.id }}">
                            {{ servidor.matricula }} - {{ servidor.nome_completo }}
                            <span class="badge bg-info">{{ servidor.get_tipo_grupo_display() }}</span>
                        </label>
                    </div>
                    {% endfor %}
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Modo de Distribuição</label>
                <select name="modo_distribuicao" class="form-select">
                    <option value="rodizio">Rodízio Sequencial</option>
                    <option value="intercalado">Intercalado (Alternando)</option>
                    <option value="balanceado">Balanceado</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Próximo <i class="bi bi-arrow-right"></i></button>
            <a href="{{ url_for('escalas.lista') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
