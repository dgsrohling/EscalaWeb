{% extends "base.html" %}
{% block title %}Nova Escala - Passo 1{% endblock %}
{% block content %}
<h1><i class="bi bi-calendar-plus"></i> Nova Escala - Passo 1/3</h1>
<p class="text-muted">Selecione o tipo de escala e a competência</p>

<div class="card">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Tipo de Escala *</label>
                <select name="tipo_escala" class="form-select" required>
                    <option value="">Selecione...</option>
                    <option value="GERAL">GERAL (17h-08h, exceto saúde)</option>
                    <option value="SAUDE">SAÚDE (17h/17h30 - 08h)</option>
                </select>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Mês *</label>
                    <select name="mes" class="form-select" required>
                        {% for m in range(1, 13) %}
                        <option value="{{ m }}">
                            {{ ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
                                'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'][m-1] }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Ano *</label>
                    <input type="number" name="ano" class="form-control" value="{{ now.year if now else 2025 }}" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Próximo <i class="bi bi-arrow-right"></i></button>
            <a href="{{ url_for('escalas.lista') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
